<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | FoodBot</title><link rel="stylesheet" href="./css/styles.css"><script type="module" src="./js/auth.js"></script></head>
<body class="auth-page">
	<a class="brand auth-brand" href="./index.html"><span class="brand-mark">F</span> foodbot</a>
	<main class="auth-layout">
		<div class="auth-photo" role="img" aria-label="Fresh food ready to share"><span>Something<br>good is<br>waiting.</span></div>
		<section class="auth-panel"><p class="eyebrow">Welcome back</p><h1>Pick up<br>where you left off.</h1><p class="muted">Sign in to see your favorites and follow your order.</p>
			<p class="notice" data-notice hidden></p>
			<form id="login-form" class="form-stack"><label>Email address<input type="email" name="email" autocomplete="email" required maxlength="254"></label><label>Password<input type="password" name="password" autocomplete="current-password" required maxlength="72"></label><button class="button button--tomato" type="submit">Sign in <span aria-hidden="true">→</span></button></form>
			<p class="form-foot">New to FoodBot? <a href="./register.html">Create an account</a></p>
		</section>
	</main>
</body>
</html>
