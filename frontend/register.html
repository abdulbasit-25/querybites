<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | FoodBot</title><link rel="stylesheet" href="/css/styles.css"><script type="module" src="/js/auth.js"></script></head>
<body class="auth-page">
	<a class="brand auth-brand" href="/"><span class="brand-mark">F</span> foodbot</a>
	<main class="auth-layout">
		<div class="auth-photo auth-photo--market" role="img" aria-label="A lively neighborhood food market"><span>Make room<br>for good<br>food.</span></div>
		<section class="auth-panel"><p class="eyebrow">Join the table</p><h1>Your next<br>favorite is close.</h1><p class="muted">Create an account to order, track, and come back to the good stuff.</p>
			<p class="notice" data-notice hidden></p>
			<form id="register-form" class="form-stack"><label>Your name<input name="fullName" autocomplete="name" required minlength="2" maxlength="120"></label><label>Email address<input type="email" name="email" autocomplete="email" required maxlength="254"></label><label>Phone <span class="optional">optional</span><input type="tel" name="phone" autocomplete="tel" maxlength="30"></label><label>Password<input type="password" name="password" autocomplete="new-password" required minlength="10" maxlength="72"></label><label>Confirm password<input type="password" name="confirmPassword" autocomplete="new-password" required minlength="10" maxlength="72"></label><button class="button button--tomato" type="submit">Create account <span aria-hidden="true">→</span></button></form>
			<p class="form-foot">Already have an account? <a href="/login.html">Sign in</a></p>
		</section>
	</main>
</body>
</html>
